name: Build Web

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter example dependencies
        working-directory: frosty_flutter/example
        run: flutter pub get

      - name: Build Flutter web release
        working-directory: frosty_flutter/example
        run: flutter build web --release --no-pub
