name: Build Wasm

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust with WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frosty_flutter/rust -> target

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Build Rust WebAssembly release
        run: cargo build --release --locked --target wasm32-unknown-unknown --manifest-path frosty_flutter/rust/Cargo.toml

      - name: Generate JavaScript bindings
        run: |
          mkdir -p "$RUNNER_TEMP/frosty-wasm"
          wasm-bindgen \
            --target no-modules \
            --out-name frosty_rust \
            --out-dir "$RUNNER_TEMP/frosty-wasm" \
            frosty_flutter/rust/target/wasm32-unknown-unknown/release/frosty_rust.wasm

      - name: Verify generated WebAssembly artifacts
        run: |
          test -s "$RUNNER_TEMP/frosty-wasm/frosty_rust.js"
          test -s "$RUNNER_TEMP/frosty-wasm/frosty_rust_bg.wasm"
