name: frosty_flutter
description: FROST threshold Schnorr signatures using an underlying Rust library for flutter
version: 4.0.1
repository: https://github.com/peercoin/frosty

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  plugin_platform_interface: ^2.1.8
  coinlib_flutter: ^5.0.1
  frosty: ^4.0.0

dev_dependencies:
  ffi: ^2.2.0
  ffigen: ^22.0.0
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: FrostyFlutterWeb
        fileName: frosty_flutter_web.dart
  assets:
    - web/pkg/frosty_rust.js
    - web/pkg/frosty_rust_bg.wasm
